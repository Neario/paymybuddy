<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction</title>
</head>
<body>
<h1>send cash</h1>
<form th:action="@{/transaction}" th:object="${transactionRequest}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <select id="receiver" th:field="*{receiver}">
        <option value="">Sélectionner une relation</option>
        <option th:each="contact : ${contacts}" th:value="${contact.relation.email}"
                th:text="${contact.relation.username} + '(' + ${contact.relation.email} + ')'">
        </option>
    </select>

    <input type="text" name="description" id="description" th:field="*{description}" placeholder="Description">

    <input id="amount" type="number" th:field="*{amount}" min="1"/>

    <button type="submit">Payer</button>

</form>

<ul th:if="${errors}">
    <li th:each="error : ${errors}" th:text="${error}" style="color: red;"></li>
</ul>


<table>
    <thead>
    <tr>
        <th>Relation</th>
        <th>Description</th>
        <th>Montant</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.getReceiver().username}"></td>
        <td th:text="${transaction.description}"></td>
        <td th:text="${@moneyUtils.toEuros(transaction.amount)}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(transactions)}">
        <td colspan="3">Aucune transaction pour le moment</td>
    </tr>
    </tbody>
</table>

</body>
</html>
