<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="min-vh-100 d-flex flex-column">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 d-flex flex-column">
    <section class="d-flex justify-content-center mt-5">
        <form th:action="@{/transaction}" th:object="${transactionRequest}" method="post" class="d-flex align-items-center g-3 gap-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div>
                <select id="receiver" th:field="*{receiver}" class="bg-transparent">
                    <option value="">Sélectionner une relation</option>
                    <option th:each="contact : ${contacts}" th:value="${contact.relation.email}"
                            th:text="${contact.relation.username} + '(' + ${contact.relation.email} + ')'">
                    </option>
                </select>
            </div>
            <div>
                <input type="text" name="description" id="description" th:field="*{description}" placeholder="Description" class="p-2">
            </div>
            <div>
                <input id="amount" type="number" th:field="*{amount}" min="1" placeholder="0€" class="p-2">
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Payer</button>
            </div>
        </form>
        <ul th:if="${errors}">
            <li th:each="error : ${errors}" th:text="${error}" style="color: red;"></li>
        </ul>
    </section>

    <section class="d-flex justify-content-center align-items-center flex-grow-1">
        <div class="d-flex flex-column w-100 border border-1 rounded">
            <h5 class="px-2 pt-2">Mes Transaction</h5>
            <table class="table">
                <thead>
                <tr>
                    <th>Relations</th>
                    <th>Description</th>
                    <th>Montant</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${transaction.getReceiver().username}"></td>
                    <td th:text="${transaction.description}"></td>
                    <td th:text="${@moneyUtils.toEuros(transaction.amount)}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="3">Aucune transaction pour le moment</td>
                </tr>
                </tbody>
            </table>
        </div>


    </section>

</main>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
