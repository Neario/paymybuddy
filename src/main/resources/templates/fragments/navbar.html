<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg mt-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"> Pay My Buddy </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-md-auto">
                <li class="nav-item me-3 fw-bold">
                    <a class="nav-link" th:href="@{/transaction}" th:classappend="${currentUri == '/transaction'} ? 'active text-primary'"> Transférer </a>
                </li>
                <li class="nav-item me-3 fw-bold">
                    <a class="nav-link" th:href="@{/}" th:classappend="${currentUri == '/'} ? 'active text-primary'"> Profil </a>
                </li>
                <li class="nav-item me-3 fw-bold">
                    <a class="nav-link" th:href="@{/contact}" th:classappend="${currentUri == '/contact'} ? 'active text-primary'"> Ajouter une relation </a>
                </li>
            </ul>

            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="nav-link btn btn-link border-0 bg-transparent fw-bold" style="color: rgba(0,0,0,0.65);">
                    Se déconnecter
                </button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
