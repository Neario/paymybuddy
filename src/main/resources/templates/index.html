<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="min-vh-100 d-flex flex-column">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container d-flex justify-content-center align-items-center flex-grow-1">
    <div class="d-flex justify-content-center gap-3">
        <div class="card border-0">
            <div class="card-body">
                <div class="item align-items-center">
                    <label class="fw-bold">
                        Username :
                    </label>
                    <p th:text="${user.username}">username</p>
                </div>

                <div class="item align-items-center">
                    <label class="fw-bold">
                        Email :
                    </label>
                    <p th:text="${user.email}">
                        email
                    </p>
                </div>
                <div class="item align-items-center">
                    <label class="fw-bold">
                        Role :
                    </label>
                    <p th:text="${user.role}">
                        role
                    </p>
                </div>
            </div>
        </div>
        <div class="d-flex flex-column justify-content-end">
            <button type="submit" href="" class="btn text-white btn-orange">Modifier</button>
        </div>
    </div>
</main>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
