<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="min-vh-100 d-flex flex-column">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container d-flex justify-content-center align-items-center flex-grow-1">
    <div class="d-flex justify-content-center gap-3 addContact">
        <div class="card border-0">
            <div class="card-body">
                <form th:action="@{/contact}" th:object="${relation}" method="post" class="d-flex flex-column gap-2">
                    <div class="d-flex align-items-end gap-2">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="d-flex flex-column">
                            <label for="email">Chercher une relation</label>
                            <input id="email" type="email" th:field="*{email}" placeholder="Saisir une adresse email"/>
                        </div>

                        <button type="submit" class="btn text-white btn-orange">Ajouter</button>
                    </div>

                    <div>
                        <div th:if="${errors}">
                            <ul>
                                <li th:each="error : ${errors}" th:text="${error}" style="color: red;"></li>
                            </ul>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
