<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="container">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card d-flex">
            <div class="card-body mx-5">
                <h5 class="rounded text-white mx-auto my-3 pt-1 pb-2 px-3">Pay My Buddy</h5>
                <div class="form-login mt-5">
                    <form th:action="@{/register}" th:object="${userRegister}" method="post">
                        <div class="mb-4">
                            <label for="username"></label>
                            <input id="username" type="text" th:field="*{username}" placeholder="Username">
                        </div>
                        <div class="mb-4">
                            <label for="email"></label>
                            <input id="email" type="email" th:field="*{email}" placeholder="Mail">
                            <div th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}" style="color:red"></div>
                        </div>
                        <div class="mb-4">
                            <label for="password"></label>
                            <input id="password" type="password" th:field="*{password}" placeholder="Mot de passe">
                        </div>
                        <button type="submit"  class="btn btn-primary d-block mx-auto my-5">S'inscrire</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
